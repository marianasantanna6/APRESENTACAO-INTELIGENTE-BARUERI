<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apresentação Inteligente | Barueri</title>

    <!-- Google Translate widget styles -->
    <style>
      /* Remove a barra azul que o Google injeta no topo da página */
      .goog-te-banner-frame,
      #goog-gt-tt,
      .goog-te-balloon-frame {
        display: none !important;
      }
      body {
        top: 0 !important;
      }

      /* Botão flutuante de tradução */
      #gt-wrapper {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 9999;
        background: #ffffff;
        border: 1.5px solid #e5e7eb;
        border-radius: 16px;
        padding: 8px 14px 8px 10px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.10), 0 2px 6px rgba(0,0,0,0.06);
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: system-ui, -apple-system, sans-serif;
        transition: box-shadow 0.2s, transform 0.2s;
      }
      #gt-wrapper:hover {
        box-shadow: 0 12px 32px rgba(0,0,0,0.14);
        transform: translateY(-1px);
      }

      /* Ícone de globo SVG inline */
      #gt-globe {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
        color: #1675b8;
      }

      /* Esconde elementos extras injetados pelo Google */
      .goog-te-gadget img { display: none; }
      .goog-te-gadget > span { display: none; }
      .goog-te-gadget { font-size: 0 !important; }

      /* Estiliza o select do Google */
      .goog-te-combo {
        border: none;
        background: transparent;
        font-size: 13.5px;
        font-weight: 500;
        color: #374151;
        cursor: pointer;
        outline: none;
        padding: 0 2px;
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 140px;
      }
      .goog-te-combo:hover { color: #1675b8; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Widget de idioma do Google Translate -->
    <div id="gt-wrapper">
      <svg id="gt-globe" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
      <div id="google_translate_element"></div>
    </div>

    <script type="module" src="/src/main.tsx"></script>

    <!-- Inicialização do Google Translate -->
    <script>
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: 'pt',
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false,
          },
          'google_translate_element'
        );
      }
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  </body>
</html>
